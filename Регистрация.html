<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="Регистрация.css">
</head>
<body>
    <div class="shapka">
        <div class="logo"></div>
    </div>
    
    <div class="main-content">
        <div class="avtoriza">
            <div class="nameboard">Регистрация</div>
            <input type="text" class="name-input" placeholder="Имя">
            <input type="email" class="email-input" placeholder="Email">
            <input type="text" class="login-input" placeholder="Логин">
            <input type="password" class="password-input" placeholder="Пароль">
            <input type="password" class="password-confirm" placeholder="Подтвердите пароль">
            <button class="reg-btn">Зарегистрироваться</button>
        </div>
        
        <button class="login-link">Уже есть аккаунт? Войти</button>
    </div>

    <div class="footer"></div>

    <script src="Регистрация.js"></script>
</body>
</html>
