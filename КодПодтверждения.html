<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email</title>
    <link rel="stylesheet" href="Авторизация.css">
    <style>
        .info-message {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid gold;
        }
        
        #displayEmail {
            color: gold;
            font-weight: bold;
        }
        
        .code-input {
            width: 100%;
            height: 45px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            border: 2px solid #82492F;
            border-radius: 8px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            padding: 0 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
        }
        
        .code-input:focus {
            outline: none;
            border-color: gold;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
            background: rgba(30, 30, 30, 0.9);
        }
        
        .resend-btn {
            width: 100%;
            height: 40px;
            background-color: transparent;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border: 1px solid gold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .resend-btn:hover {
            background-color: rgba(255,215,0,0.2);
            transform: scale(1.02);
        }
        
        .timer {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="shapka">
        <div class="logo"></div>
    </div>
    
    <div class="main-content">
        <div class="avtoriza">
            <div class="nameboard">Подтверждение</div>
            <div class="info-message">
                Код отправлен на email: <span id="displayEmail"></span>
            </div>
            <input type="text" class="code-input" id="codeInput" placeholder="______" maxlength="6" inputmode="numeric">
            <button class="avt" id="verifyBtn">Подтвердить</button>
            <button class="resend-btn" id="resendBtn">Отправить код повторно</button>
            <div class="timer" id="timer"></div>
        </div>
    </div>

    <div class="footer"></div>

    <script src="КодПодтверждения.js"></script>
</body>
</html>
