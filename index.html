<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Колесо Фортуны</title>
    <link rel="stylesheet" href="ЛК.css">
</head>
<body>
    <div class="shapka">
        <div class="logo"></div>
    </div>
    
    <div class="main-content">
        <div class="profile-header">
            <div class="avatar"></div>
            <div class="nik">Имя пользователя</div>
        </div>

        <div class="games-section">
            <div class="last-game">
                <div class="border-name">Последняя игра</div>
                <div class="result">Результат последней игры</div>
                <div class="game-buttons">
                    <button class="save">Сохранить</button>
                    <button class="del">Удалить</button>
                </div>
            </div>

            <button class="exit" data-href="Колесо Фортуны.html">На главную</button>

            <div class="right-column">
                <div class="prev-games" id="prevGames">
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="logout-section">
            <button class="logout">Выйти из аккаунта</button>
        </div>
    </div>
    <script src="ЛК.js"></script>
</body>
</html>
